name: Publish the Akash node image

on:
  workflow_dispatch:
  push:
    paths:
      - 'deploy/akash/**'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: deploy/akash
          push: true
          tags: |
            ghcr.io/ivcained/fiddy-node:0.1.1
            ghcr.io/ivcained/fiddy-node:latest
