name: Verify Fiddy

# The repo's own gates, on every push to main and every pull request.
#
# One runner per gate (matrix) so a red gate never hides the other two: the
# run's conclusion names which of lint / typecheck / test broke.
#
# Scope is the farcaster-web package, where the client, the snapchain seams and
# their tests live:
#   lint      -> eslint
#   typecheck -> tsc -p tsconfig.json --noEmit
#   test      -> vitest run
# The probes under apps/farcaster-web/scripts/ are deliberately NOT here: they
# drive a live node and a headless Chrome against a running client, so they are
# run by hand, not on a runner.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: fiddy-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.gate }} (farcaster-web)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        gate: [lint, typecheck, test]
    env:
      # The repo installs husky from `prepare`; hooks are pointless on a runner.
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # farcaster-web imports the workspace packages by name and reads their
      # `dist` (gitignored), so both typecheck and test need them built first;
      # lint does not.
      - name: Build workspace packages
        if: matrix.gate != 'lint'
        run: pnpm build:packages

      - name: ${{ matrix.gate }}
        run: pnpm --filter farcaster-web ${{ matrix.gate }}

  # The microsite's own gate. Separate job because it is a separate tree: `site/`
  # is deployed by scripts/deploy-microsite.sh into /var/www/fiddy-client/, not
  # by a client release, and what it checks is what that deploy uploads — every
  # page's fc:miniapp against the pictures the tree really carries, and the
  # splash's pixels against the colour the page paints behind it. Node's own
  # modules only: no install, no browser, seconds.
  microsite:
    name: microsite (site/)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: the /client microsite and the mini app it launches
        run: node scripts/check-microsite-assets.mjs
